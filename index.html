<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ANIME LOG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap" rel="stylesheet"/>
<style>
/* UD対応デザイン: 明度差を高く、色だけに依存しない情報伝達 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f4f5f7;
  --surface:#ffffff;
  --surface2:#eef0f4;
  --border:#d0d5dd;
  --border-strong:#b0b8c8;
  --text:#1a1d24;
  --text-sub:#4a5568;
  --muted:#7a8599;
  --accent:#1a56db;
  --accent-light:#e8efff;
  --ok:#0e7a4e;
  --ok-bg:#e6f5ee;
  --err:#c0392b;
  --err-bg:#fdecea;
  --gold:#b8860b;
  --gold-bg:#fef9e7;
}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100vh;font-size:14px;line-height:1.6;}
input,textarea,select,button{font-family:'Noto Sans JP',sans-serif;}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 80px;}

/* ヘッダー */
.masthead{border-bottom:2px solid var(--border);margin-bottom:28px;padding-bottom:18px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;}
.masthead-logo{font-family:'Noto Sans JP',sans-serif;font-size:22px;font-weight:700;letter-spacing:1px;color:var(--accent);line-height:1;}
.masthead-sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px;}
.user-badge{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px 5px 6px;font-size:13px;color:var(--text-sub);}
.user-badge img{width:24px;height:24px;border-radius:50%;object-fit:cover;}

/* トークン */
.token-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.field-label{font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;display:block;}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.inp{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.15);}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;transition:opacity .15s,transform .1s,box-shadow .15s;white-space:nowrap;}
.btn:hover{opacity:.88;box-shadow:0 2px 8px rgba(0,0,0,.12);}.btn:active{transform:scale(.97);}.btn:disabled{opacity:.4;cursor:default;}
.btn-gold{background:var(--accent);color:#fff;}
.btn-ghost{background:var(--surface);border:1.5px solid var(--border);color:var(--text-sub);}
.btn-sm{padding:7px 13px;font-size:12px;}
.ok-text{font-size:12px;color:var(--ok);margin-top:6px;font-weight:500;}
.err-text{font-size:12px;color:var(--err);margin-top:6px;font-weight:500;}

/* コントロール */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.controls select{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none;cursor:pointer;}
.controls select:focus{border-color:var(--accent);}
.controls select option{background:var(--surface);}
.sep{width:1px;height:26px;background:var(--border);flex-shrink:0;}

/* 検索・並び替え */
.search-row{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
.search-row .inp{max-width:300px;}
.sort-row{display:flex;gap:6px;align-items:center;margin-left:auto;}
.sort-label{font-size:12px;color:var(--text-sub);font-weight:500;}
.sort-btn{padding:5px 11px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:12px;cursor:pointer;transition:all .15s;}
.sort-btn:hover{border-color:var(--accent);color:var(--accent);}
.sort-btn.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent);font-weight:700;}

/* メディアタブ */
.media-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid var(--border);}
.media-tab{padding:10px 24px;border:none;background:transparent;color:var(--text-sub);font-size:14px;font-weight:700;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;font-family:'Noto Sans JP',sans-serif;}
.media-tab:hover{color:var(--accent);}
.media-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* フィルターチップ */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.fchip-label{font-size:12px;color:var(--text-sub);margin-right:4px;font-weight:500;}
.fchip{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.fchip:hover{border-color:var(--accent);color:var(--accent);}
.fchip.all-active{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* 統計 */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.stat-pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.stat-badge{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;}

/* 保存バー */
.save-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--gold-bg);border:1px solid #e6c84a;border-radius:10px;padding:10px 16px;margin-bottom:20px;}
.save-bar-text{font-size:12px;color:#7a6010;flex:1;}
.save-indicator{font-size:11px;color:var(--ok);font-weight:700;}

/* カウント */
.list-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.count-label{font-size:13px;color:var(--text-sub);font-weight:500;}

/* カードグリッド */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.acard{background:var(--surface);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .18s,box-shadow .18s;position:relative;}
.acard:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,86,219,.12);}

/* カード上部 */
.card-top{display:flex;height:130px;overflow:hidden;position:relative;}
.card-poster{width:90px;flex-shrink:0;background:var(--surface2);overflow:hidden;}
.card-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.card-poster .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--surface2);}
.card-info{flex:1;padding:12px 12px 10px;display:flex;flex-direction:column;min-width:0;}
.card-title{font-family:'Noto Serif JP',serif;font-size:13px;font-weight:700;line-height:1.55;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:1;}
.card-meta{font-size:11px;color:var(--muted);margin-top:6px;}
.card-links{display:flex;gap:5px;margin-top:5px;}
.card-link{font-size:11px;color:var(--accent);border:1px solid var(--border);border-radius:4px;padding:2px 8px;text-decoration:none;transition:all .15s;font-weight:500;}
.card-link:hover{background:var(--accent-light);border-color:var(--accent);}

/* 評価バッジ */
.rating-badge{position:absolute;top:8px;right:8px;min-width:36px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2);}

/* カード下部 */
.card-bottom{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--border);}

/* 視聴トグル */
.watched-row{display:flex;align-items:center;}
.toggle-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:var(--text-sub);user-select:none;font-weight:500;}
.toggle-label input{display:none;}
.toggle-box{width:36px;height:20px;border-radius:10px;background:var(--border);border:1.5px solid var(--border-strong);position:relative;transition:background .2s,border-color .2s;flex-shrink:0;}
.toggle-box::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;}
.toggle-label input:checked+.toggle-box{background:var(--ok);border-color:var(--ok);}
.toggle-label input:checked+.toggle-box::after{transform:translateX(16px);}

/* 評価ボタン */
.rating-row{display:flex;gap:4px;}
.ropt{flex:1;padding:7px 2px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s;text-align:center;}
.ropt:hover{border-color:var(--accent);color:var(--accent);}
.ropt.active{border-color:transparent;}

/* 感想エリア */
.ctabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
.ctab-label{font-size:11px;color:var(--muted);font-weight:700;margin-right:2px;}
.ctab{padding:3px 9px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);color:var(--text-sub);font-size:11px;cursor:pointer;font-weight:700;transition:all .15s;}
.ctab:hover{border-color:var(--accent);color:var(--accent);}
.ctab.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent);}
.ctab-x{color:var(--err);border-color:rgba(192,57,43,.3);}
.comment-area{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;resize:none;outline:none;width:100%;line-height:1.6;height:68px;transition:border-color .15s,box-shadow .15s;}
.comment-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,86,219,.1);}
.comment-area::placeholder{color:var(--muted);}

/* 空・ローディング */
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:14px;}
.empty .big{font-size:36px;margin-bottom:12px;}
.empty p{font-size:13px;line-height:1.7;}
.loading-wrap{grid-column:1/-1;padding:50px 0;text-align:center;color:var(--text-sub);font-size:14px;}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:12px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:11px 22px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:999;animation:fadeIn .25s ease;max-width:90vw;text-align:center;white-space:nowrap;}
.toast.ok{border-color:#0e7a4e;color:var(--ok);background:var(--ok-bg);}
.toast.err{border-color:#c0392b;color:var(--err);background:var(--err-bg);}
.toast.info{border-color:#1a56db;color:var(--accent);background:var(--accent-light);}

/* モーダル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,.15);}
.modal h3{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text);}
.modal p{font-size:13px;color:var(--text-sub);margin-bottom:12px;}
.modal textarea{width:100%;height:160px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:12px;font-family:monospace;outline:none;resize:none;}
.modal textarea:focus{border-color:var(--accent);}
.modal-btns{display:flex;gap:8px;margin-top:12px;justify-content:flex-end;}

/* スクロールバー */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--surface2);}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
const { useState, useEffect, useCallback, useRef } = React;
const html = htm.bind(React.createElement);

const GQL        = "https://api.annict.com/graphql";
const STORAGE_KEY = "animelog_v1";
const TOKEN_KEY   = "animelog_token";

const RATINGS = [
  { id:"S+", label:"S+", color:"#f5c842", bg:"linear-gradient(135deg,#f5c842,#e8a020)", text:"#111" },
  { id:"S",  label:"S",  color:"#f59342", bg:"linear-gradient(135deg,#f59342,#e06820)", text:"#fff" },
  { id:"A+", label:"A+", color:"#e05a7a", bg:"linear-gradient(135deg,#e05a7a,#c0325a)", text:"#fff" },
  { id:"A",  label:"A",  color:"#c06ab0", bg:"linear-gradient(135deg,#c06ab0,#9040a0)", text:"#fff" },
  { id:"B",  label:"B",  color:"#6ab0e0", bg:"linear-gradient(135deg,#6ab0e0,#4080c0)", text:"#fff" },
  { id:"C",  label:"C",  color:"#60b880", bg:"linear-gradient(135deg,#60b880,#3a9060)", text:"#fff" },
  { id:"D",  label:"D",  color:"#888",    bg:"linear-gradient(135deg,#666,#444)",       text:"#ccc" },
];
const RATING_ORDER = {"S+":0,"S":1,"A+":2,"A":3,"B":4,"C":5,"D":6,"":99};
const SEASON_NAMES = {SPRING:"春",SUMMER:"夏",AUTUMN:"秋",WINTER:"冬"};

// 今の実際の日付から「現在クール」を計算
function currentSeason() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1; // 1-12
  // 1-3月: winter, 4-6月: spring, 7-9月: summer, 10-12月: autumn
  const name = month <= 3 ? "winter" : month <= 6 ? "spring" : month <= 9 ? "summer" : "autumn";
  return { year, name };
}

function buildSeasons() {
  const en = ["spring","summer","autumn","winter"];
  const ja = ["春","夏","秋","冬"];
  const list = [];
  const cur = currentSeason();

  // 上限: 現在クールの1年後（4クール先）
  let year = cur.year + 1;
  let si   = en.indexOf(cur.name); // 1年後の同クールから始める

  // 下限: 2024年冬
  const LIMIT_YEAR = 2023, LIMIT_SI = 3; // winter=3

  while (true) {
    list.push({ value:`${year}-${en[si]}`, label:`${year}年 ${ja[si]}` });
    // 下限チェック
    if (year === LIMIT_YEAR && si === LIMIT_SI) break;
    const prevSi = si;
    si--;
    if (si < 0) { si = 3; }
    if (prevSi === 3) { year--; }
    // 念のため無限ループ防止
    if (year < LIMIT_YEAR - 1) break;
  }
  return list;
}
const SEASONS = buildSeasons();
const CURRENT_SEASON = (() => {
  const { year, name } = currentSeason();
  return `${year}-${name}`;
})();

async function gqlFetch(token, query, vars = {}) {
  const r = await fetch(GQL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
    body: JSON.stringify({ query, variables: vars }),
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (j.errors) throw new Error(j.errors[0].message);
  return j.data;
}

const Q_ME = `query{ viewer{ name avatarUrl } }`;

// REST API ヘルパー (画像取得用)
async function restFetch(token, endpoint, params = {}) {
  const url = new URL(`https://api.annict.com/v1/${endpoint}`);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, String(v)));
  const r = await fetch(url.toString(), {
    headers: { "Authorization": `Bearer ${token}` }
  });
  if (!r.ok) throw new Error(`REST HTTP ${r.status}`);
  return r.json();
}

function pickRestImage(images) {
  if (!images) return null;
  return images.recommended_url ||
         images.facebook?.og_image_url ||
         images.twitter?.original_avatar_url ||
         images.twitter?.bigger_avatar_url ||
         images.twitter?.normal_avatar_url || null;
}

// 選択クールが属する年の全クールを返す
// 選択クールの視聴状態を取得するクエリ
const Q_SEASON_WITH_LIB = `
query($season:String!, $after:String){
  viewer{
    libraryEntries(states:[WATCHING, WATCHED], first:2000){
      nodes{ work{ annictId } }
    }
  }
  searchWorks(seasons:[$season], orderBy:{field:WATCHERS_COUNT,direction:DESC}, first:100, after:$after){
    pageInfo{ hasNextPage endCursor }
    nodes{
      annictId title seasonName seasonYear media
      image{ recommendedImageUrl }
      officialSiteUrl twitterUsername
    }
  }
}`;

// タイトル検索クエリ（手動追加用）
const Q_SEARCH_WORKS = `
query($title:String!){
  searchWorks(titles:[$title], orderBy:{field:WATCHERS_COUNT,direction:DESC}, first:10){
    nodes{
      annictId title seasonName seasonYear media
      viewerStatusState
      image{ recommendedImageUrl }
      officialSiteUrl twitterUsername
    }
  }
}`;

function pickImage(image) {
  if (!image) return null;
  return image.recommendedImageUrl || null;
}

function workToItem(w, watched = false) {
  return {
    id: String(w.annictId), title: w.title,
    season: w.seasonYear ? `${w.seasonYear}年${SEASON_NAMES[w.seasonName] ?? ""}` : "",
    image: pickImage(w.image),
    site: w.officialSiteUrl ?? null,
    twitter: w.twitterUsername ?? null,
    media: (w.media ?? "TV").toLowerCase(),
    ratings: [""], comments: [""], watched: watched === true,
  };
}

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
// 旧形式(comment: string / rating: string)を新形式(comments/ratings: string[])へ正規化
// クールごとのスロットとして comments と ratings を同じ長さに揃える
function normalizeSlots(x) {
  const comments = Array.isArray(x?.comments) && x.comments.length > 0
    ? x.comments.slice()
    : (typeof x?.comment === "string" && x.comment !== "" ? [x.comment] : [""]);
  const ratings = Array.isArray(x?.ratings) && x.ratings.length > 0
    ? x.ratings.slice()
    : (typeof x?.rating === "string" && x.rating !== "" ? [x.rating] : [""]);
  while (ratings.length < comments.length) ratings.push("");
  ratings.length = comments.length;
  return { comments, ratings };
}
function hasAnyComment(comments) {
  return (comments ?? []).some(c => (c ?? "").trim() !== "");
}
function hasAnyRating(ratings) {
  return (ratings ?? []).some(r => (r ?? "") !== "");
}
// カード代表評価: 最も新しいクール（スロット配列の末尾）の評価を使う
function repRating(item) {
  const ratings = item?.ratings ?? [];
  return ratings.length > 0 ? (ratings[ratings.length - 1] ?? "") : "";
}

function mergeSaved(items, saved, currentSeason) {
  const next = {};
  // APIから取得した作品に評価・感想をマージ
  for (const id in items) {
    const s = saved[id];
    if (s?._manual) {
      // 手動追加アイテムはsavedの内容を優先（watched含む全フィールドを復元、idを保証）
      next[id] = { ...items[id], ...s, id, ...normalizeSlots(s) };
    } else {
      // 通常アイテム: watched はAPIから取得、rating/commentのみ復元
      next[id] = { ...items[id], ...(s ? normalizeSlots(s) : {}), watched: items[id].watched === true };
    }
  }
  // APIにない手動追加アイテムをsavedから復元（idを保証）
  // 追加時のクールを記録したアイテムは、そのクールを開いている時だけ復元する
  // （記録がない旧データは互換のため常に復元＝従来通り全クールに表示）
  for (const id in saved) {
    if (saved[id]._manual && !next[id]) {
      const addedSeason = saved[id].addedSeason;
      if (addedSeason == null || addedSeason === currentSeason) {
        next[id] = { ...saved[id], id, ...normalizeSlots(saved[id]) };
      }
    }
  }
  return next;
}
function extractSaveable(items) {
  const out = {};
  for (const id in items) {
    const { ratings, comments, _manual, title, season, image, site, twitter, media, watched, addedSeason } = items[id];
    if (_manual) {
      // 手動追加アイテムは作品情報ごと保存（idも含める）
      out[id] = { id, ratings: ratings ?? [""], comments: comments ?? [""], _manual: true, addedSeason,
                  title, season, image, site, twitter, media, watched: watched === true };
    } else if (hasAnyRating(ratings) || hasAnyComment(comments)) {
      out[id] = { ratings, comments };
    }
    // 評価も感想もない通常アイテムは保存しない（削除を効かせる）
  }
  return out;
}

function AnimeCard({ item, index, onChange }) {
  if (!item || !item.id) return null; // 不正なitemは描画しない
  const [ci, setCi] = useState(0); // 選択中の感想/評価スロット
  const comments = (item.comments && item.comments.length > 0) ? item.comments : [""];
  const ratings  = (item.ratings  && item.ratings.length  > 0) ? item.ratings  : [""];
  const idx = Math.min(ci, comments.length - 1);
  const curRating = ratings[idx] ?? "";
  const ri = RATINGS.find(r => r.id === (repRating(item) || "")); // バッジは最新クールの評価を代表表示
  const setComment = (text) => {
    const next = comments.slice();
    next[idx] = text;
    onChange({ comments: next });
  };
  const setRating = (val) => {
    const next = ratings.slice();
    while (next.length < comments.length) next.push("");
    next[idx] = val;
    onChange({ ratings: next });
  };
  return html`
    <div class="acard" style=${{ animation: `fadeIn .3s ease ${Math.min(index, 20) * 25}ms both` }}>
      <div class="card-top">
        <div class="card-poster">
          ${item.image
            ? html`<img src=${item.image} alt=${item.title}
                onError=${async () => {
                  // リンク切れ画像: OGP（Annictサイトのサムネイル）に差し替え
                  // それでも失敗したらプレースホルダーに落とす
                  if (item._imgRetried) { onChange({ image: null }); return; }
                  const ogp = await fetchOgpImage(item.id);
                  onChange({ image: (ogp && ogp !== item.image) ? ogp : null, _imgRetried: true });
                }} />`
            : html`<div class="no-img">🎞️</div>`}
        </div>
        <div class="card-info">
          <div class="card-title">${item.title}</div>
          <div class="card-meta">${item.season}</div>
          <div class="card-links">
            ${item.site    && html`<a class="card-link" href=${item.site} target="_blank" rel="noreferrer">公式</a>`}
            ${item.twitter && html`<a class="card-link" href=${`https://twitter.com/${item.twitter}`} target="_blank" rel="noreferrer">X</a>`}
          </div>
        </div>
        ${ri && html`<div class="rating-badge" style=${{ background: ri.bg, color: ri.text }}>${ri.label}</div>`}
      </div>
      <div class="card-bottom">
        <div class="watched-row">
          <label class="toggle-label">
            <input type="checkbox" checked=${!!item.watched} onChange=${e => onChange({ watched: e.target.checked })} />
            <div class="toggle-box"></div>
            視聴済み
          </label>
        </div>
        <div class="rating-row">
          ${RATINGS.map(r => html`
            <button key=${r.id}
              class=${`ropt${curRating === r.id ? " active" : ""}`}
              style=${curRating === r.id ? { background: r.bg, color: r.text } : {}}
              onClick=${() => setRating(curRating === r.id ? "" : r.id)}>
              ${r.label}
            </button>
          `)}
        </div>
        <div class="ctabs">
          <span class="ctab-label">感想</span>
          ${comments.map((_, i) => html`
            <button key=${i} class=${`ctab${i === idx ? " active" : ""}`}
              onClick=${() => setCi(i)}>${i + 1}</button>
          `)}
          <button class="ctab" title="感想スロットを追加（年間アニメのクール別感想・評価などに）"
            onClick=${() => {
              onChange({ comments: [...comments, ""], ratings: [...ratings, ""] });
              setCi(comments.length);
            }}>＋</button>
          ${comments.length > 1 && html`
            <button class="ctab ctab-x" title="このスロットを削除"
              onClick=${() => {
                const nextComments = comments.filter((_, i) => i !== idx);
                const nextRatings  = ratings.filter((_, i) => i !== idx);
                onChange({ comments: nextComments, ratings: nextRatings });
                setCi(Math.max(0, idx - 1));
              }}>✕</button>
          `}
        </div>
        <textarea class="comment-area" placeholder=${comments.length > 1 ? `感想 ${idx + 1}…` : "感想・メモ…"}
          value=${comments[idx] ?? ""}
          onChange=${e => setComment(e.target.value)}>
        </textarea>
      </div>
    </div>
  `;
}

// ── 画像取得ユーティリティ（グローバルスコープ） ──────────────────────────

const anilistCache = {}; // id -> url | null

const wait = (ms) => new Promise(r => setTimeout(r, ms));

// 1件ずつ取得（バッチ失敗時のフォールバック）
async function fetchAniListSingle(item) {
  const query = `query($t:String){ Media(search:$t, type:ANIME){ coverImage{ large } } }`;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      if (attempt > 0) await wait(1000);
      const r = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables: { t: item.title } })
      });
      if (r.status === 429) { await wait(5000); continue; }
      if (!r.ok) break;
      const j = await r.json();
      return j?.data?.Media?.coverImage?.large ?? null;
    } catch {}
  }
  return null;
}

// エイリアス+変数を使って最大10件を1リクエストで取得
async function fetchAniListBatch(items) {
  const targets = items.filter(x => anilistCache[x.id] === undefined);
  if (targets.length === 0) return;

  const varDefs = targets.map((_, i) => `$t${i}: String`).join(", ");
  const fields  = targets.map((_, i) =>
    `a${i}: Media(search: $t${i}, type: ANIME) { coverImage { large } }`
  ).join(" ");
  const query = `query(${varDefs}) { ${fields} }`;
  const variables = {};
  targets.forEach((x, i) => { variables[`t${i}`] = x.title; });

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      if (attempt > 0) await wait(attempt * 1500);
      const r = await fetch("https://graphql.anilist.co", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, variables })
      });
      if (r.status === 429) {
        await wait((parseInt(r.headers.get("Retry-After") || "5")) * 1000);
        continue;
      }
      if (!r.ok) break;
      const j = await r.json();
      // errorsがある場合も含めて確認
      const hasErrors = j?.errors?.length > 0;
      targets.forEach((x, i) => {
        const url = j?.data?.[`a${i}`]?.coverImage?.large;
        // dataに値があればキャッシュ（errorsがあっても部分的に取れることがある）
        if (url !== undefined) anilistCache[x.id] = url ?? null;
      });
      // バッチ全体が成功していれば終了
      if (!hasErrors) return;
      // errorsがある場合は未取得分を個別フォールバック
      const stillPending = targets.filter(x => anilistCache[x.id] === undefined);
      for (const item of stillPending) {
        anilistCache[item.id] = await fetchAniListSingle(item);
        await wait(200);
      }
      return;
    } catch {}
  }
  // バッチ自体が全滅した場合は個別取得にフォールバック
  for (const item of targets) {
    if (anilistCache[item.id] === undefined) {
      anilistCache[item.id] = await fetchAniListSingle(item);
      await wait(200);
    }
  }
}

function loadImgFromUrl(url) {
  return new Promise(res => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload  = () => res(img);
    img.onerror = () => res(null);
    img.src = url;
  });
}

// 複数アイテムの画像URLをまとめてキャッシュに入れる（出力前に呼ぶ）
async function preloadAniListImages(items) {
  const BATCH = 10; // バッチサイズを20→10に削減して安定性向上
  for (let i = 0; i < items.length; i += BATCH) {
    await fetchAniListBatch(items.slice(i, i + BATCH));
    if (i + BATCH < items.length) await wait(600);
  }
}

async function loadImg(item) {
  // 1. Annictサイトのサムネイル（OGP）を最優先で取得
  //    imgproxy配信のためCORSヘッダーがなく、必ず自ドメインのプロキシ経由で読み込む
  const ogpUrl = await fetchOgpImage(item.id);
  if (ogpUrl) {
    const img = await loadImgFromUrl(`/api/img?url=${encodeURIComponent(ogpUrl)}`);
    if (img) return img;
  }
  // 2. Annict APIの画像（直接 → プロキシ経由）
  if (item.image) {
    const direct = await loadImgFromUrl(item.image);
    if (direct) return direct;
    const proxied = await loadImgFromUrl(`/api/img?url=${encodeURIComponent(item.image)}`);
    if (proxied) return proxied;
  }
  // 3. AniList（最終フォールバック）
  if (anilistCache[item.id] === undefined) {
    anilistCache[item.id] = await fetchAniListImage(item.title);
  }
  const aniUrl = anilistCache[item.id];
  if (aniUrl) {
    const img = await loadImgFromUrl(aniUrl);
    if (img) return img;
  }
  return null;
}

// ── サーバー同期（Vercel + Upstash Redis）──────────────────────────────────
// トークンをキーにユーザーごとのデータを保存/読み込みする
async function serverLoad(token) {
  try {
    const r = await fetch("/api/load", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    if (!r.ok) return null;
    const j = await r.json();
    return j?.data ?? null;
  } catch {
    return null;
  }
}

async function serverSave(token, data) {
  try {
    const r = await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, data }),
    });
    return r.ok;
  } catch {
    return false;
  }
}

// OGPフォールバック: /api/ogp から画像URLを取得（AniListでも見つからない場合の最終手段）
const ogpCache = {}; // id -> url | null
async function fetchOgpImage(id) {
  if (ogpCache[id] !== undefined) return ogpCache[id];
  try {
    const r = await fetch(`/api/ogp?id=${encodeURIComponent(id)}`);
    if (!r.ok) { ogpCache[id] = null; return null; }
    const j = await r.json();
    ogpCache[id] = j?.image ?? null;
    return ogpCache[id];
  } catch {
    ogpCache[id] = null;
    return null;
  }
}

    // 画像がない作品をREST APIで補完（per_page上限50に合わせて50件ずつ分割）
    const noImageIds = Object.values(fresh).filter(x => !x.image).map(x => x.id);
    for (let i = 0; i < noImageIds.length; i += 50) {
      const chunk = noImageIds.slice(i, i + 50);
      try {
        const restData = await restFetch(tok, "works", {
          filter_ids: chunk.join(","), fields: "id,images", per_page: 50,

          if (fresh[id] && !fresh[id].image) fresh[id] = { ...fresh[id], image: pickRestImage(w.images) };

    }
    return fresh;
  };

  // 画像なし作品の補完: AniList(一括) → OGP(3並列) の順に試す
  const enrichImages = useCallback(async (targetItems) => {
    const noImage = Object.values(targetItems).filter(x => !x.image);
    if (noImage.length === 0) return;
    // Step1: OGP（Annictサイトのサムネイル）を最優先で取得（3並列）
    const updates = {};
    const stillNull = [];
    const PAR = 3;
    for (let i = 0; i < noImage.length; i += PAR) {
      const chunk = noImage.slice(i, i + PAR);
      const results = await Promise.all(chunk.map(async x => [x, await fetchOgpImage(x.id)]));
      results.forEach(([x, url]) => {
        if (url) updates[x.id] = url;
        else stillNull.push(x);
      });
    }
    // Step2: OGPで取れなかった分のみAniList一括取得
    if (stillNull.length > 0) {
      await preloadAniListImages(stillNull);
      for (const x of stillNull) {
        const url = anilistCache[x.id];
        if (url) updates[x.id] = url;
      }

    // 取得できた分だけ画像を反映

    existing[id] = { ratings: [""], comments: [""], _manual: true, ...item };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(existing));
    setItems(prev => ({ ...prev, [id]: item }));
    showToast(`「${w.title}」を追加しました`, "ok");
  };

  // ── 画像出力（複数ページ対応・感想メモ付き） ────────────────────────────
  const exportImage = async () => {
    // 評価済みのみ対象
    const exportTargets = visible.filter(x => repRating(x) !== "");
    if (exportTargets.length === 0) { showToast("評価済みの作品がありません", "err"); return; }
    showToast(`評価済み ${exportTargets.length} 件の画像を生成中…`, "info", 60000);

    // カードサイズ定義（横長カード: 左ポスター + 右情報）
    const POSTER_W  = 120;
    const POSTER_H  = 170;
    const INFO_W    = 290;
    const CARD_W    = POSTER_W + INFO_W;
    const CARD_H    = POSTER_H;
    const COLS = 2;
    const ROWS_PER_PAGE = 6;
    const CARDS_PER_PAGE = COLS * ROWS_PER_PAGE;
    const PAD = 24, GAP = 14;
    const HEADER_H = 0;
    const FOOTER_H = 0;
    const CW = PAD * 2 + COLS * CARD_W + (COLS - 1) * GAP;
    const CH = HEADER_H + PAD + ROWS_PER_PAGE * CARD_H + (ROWS_PER_PAGE - 1) * GAP + PAD + FOOTER_H;

    const RATING_MAP = {
      "S+":{ bg:"#f5c842", text:"#111" }, "S":{ bg:"#f59342", text:"#fff" },
      "A+":{ bg:"#e05a7a", text:"#fff" }, "A":{ bg:"#c06ab0", text:"#fff" },
      "B" :{ bg:"#6ab0e0", text:"#fff" }, "C":{ bg:"#60b880", text:"#fff" },
      "D" :{ bg:"#555555", text:"#ccc" }
    };

    // AniList APIでタイトル検索して画像URLを取得
    // roundRect ポリフィル（古いブラウザ対応）
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.beginPath();
        this.moveTo(x+r,y); this.lineTo(x+w-r,y);
        this.quadraticCurveTo(x+w,y,x+w,y+r);
        this.lineTo(x+w,y+h-r);
        this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        this.lineTo(x+r,y+h);
        this.quadraticCurveTo(x,y+h,x,y+h-r);
        this.lineTo(x,y+r);
        this.quadraticCurveTo(x,y,x+r,y);
        this.closePath();
      };
    }

    const drawRoundRect = (ctx, x, y, w, h, r, fill, stroke) => {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      if (fill)   { ctx.fillStyle = fill;     ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    };

    const wrapLines = (ctx, text, maxW, maxLines) => {
      const lines = [];
      let cur = "";
      for (const ch of text) {
        const test = cur + ch;
        if (ctx.measureText(test).width > maxW && cur.length > 0) {
          lines.push(cur); cur = ch;
          if (lines.length >= maxLines) break;
        } else { cur = test; }
      }
      if (cur && lines.length < maxLines) lines.push(cur);
      return lines;
    };

    const totalPages = Math.ceil(exportTargets.length / CARDS_PER_PAGE);
    const canvases = [];

    for (let page = 0; page < totalPages; page++) {
      const pageItems = exportTargets.slice(page * CARDS_PER_PAGE, (page + 1) * CARDS_PER_PAGE);
      const rows = Math.ceil(pageItems.length / COLS);
      const canvasH = PAD + rows * CARD_H + (rows - 1) * GAP + PAD;

      const canvas = document.createElement("canvas");
      canvas.width  = CW;
      canvas.height = canvasH;
      const ctx = canvas.getContext("2d");

      // 背景（白）
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, CW, canvasH);

      // カード描画
      for (let i = 0; i < pageItems.length; i++) {
        const item = pageItems[i];
        const col  = i % COLS;
        const row  = Math.floor(i / COLS);
        const cx   = PAD + col * (CARD_W + GAP);
        const cy   = HEADER_H + PAD + row * (CARD_H + GAP);

        // ── カード背景 ──
        drawRoundRect(ctx, cx, cy, CARD_W, CARD_H, 8, "#f8f9fa", "#d0d5dd");

        // ── 左: ポスター画像 ──
        const img = await loadImg(item);
        if (img) {
          ctx.save();
          // 左側だけ角丸クリップ
          ctx.beginPath();
          ctx.moveTo(cx + 8, cy);
          ctx.lineTo(cx + POSTER_W, cy);
          ctx.lineTo(cx + POSTER_W, cy + POSTER_H);
          ctx.lineTo(cx + 8, cy + POSTER_H);
          ctx.quadraticCurveTo(cx, cy + POSTER_H, cx, cy + POSTER_H - 8);
          ctx.lineTo(cx, cy + 8);
          ctx.quadraticCurveTo(cx, cy, cx + 8, cy);
          ctx.closePath();
          ctx.clip();
          const iAR = img.width / img.height;
          const cAR = POSTER_W / POSTER_H;
          let sw, sh, sx, sy;
          if (iAR > cAR) { sh = img.height; sw = sh * cAR; sx = (img.width - sw) / 2; sy = 0; }
          else            { sw = img.width;  sh = sw / cAR; sy = (img.height - sh) / 2; sx = 0; }
          ctx.drawImage(img, sx, sy, sw, sh, cx, cy, POSTER_W, POSTER_H);
          ctx.restore();
        } else {
          // プレースホルダー
          ctx.fillStyle = "#e8eaf0";
          ctx.beginPath();
          ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + POSTER_W, cy);
          ctx.lineTo(cx + POSTER_W, cy + POSTER_H); ctx.lineTo(cx + 8, cy + POSTER_H);
          ctx.quadraticCurveTo(cx, cy + POSTER_H, cx, cy + POSTER_H - 8);
          ctx.lineTo(cx, cy + 8); ctx.quadraticCurveTo(cx, cy, cx + 8, cy);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = "#9098b0";
          ctx.font = "30px Arial"; ctx.textAlign = "center";
          ctx.fillText("🎞️", cx + POSTER_W / 2, cy + POSTER_H / 2 + 12);
          ctx.textAlign = "left";
        }

        // ── ポスターと情報エリアの縦区切り ──
        ctx.strokeStyle = "#e0e4ec";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx + POSTER_W, cy + 8);
        ctx.lineTo(cx + POSTER_W, cy + POSTER_H - 8);
        ctx.stroke();

        // ── 右: 情報エリア ──
        const ix = cx + POSTER_W + 12;
        const iw = INFO_W - 16;

        // シーズン
        ctx.fillStyle = "#7a8599";
        ctx.font = "11px 'Helvetica Neue', Arial, sans-serif";
        ctx.fillText(item.season || "", ix, cy + 16, iw);

        // タイトル
        ctx.fillStyle = "#1a1d24";
        ctx.font = "bold 14px 'Helvetica Neue', Arial, sans-serif";
        const titleLines = wrapLines(ctx, item.title, iw, 2);
        titleLines.forEach((line, li) => {
          ctx.fillText(line, ix, cy + 34 + li * 18, iw);
        });

        // 評価バッジ（最も新しいクールの評価を代表表示）
        const itemRating = repRating(item);
        if (itemRating && RATING_MAP[itemRating]) {
          const rc = RATING_MAP[itemRating];
          const BW = 40, BH = 24, BY = cy + 74;
          drawRoundRect(ctx, ix, BY, BW, BH, 5, rc.bg, null);
          ctx.fillStyle = rc.text;
          ctx.font = "bold 13px 'Helvetica Neue', Arial, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(itemRating, ix + BW / 2, BY + 16);
          ctx.textAlign = "left";
        }

        // 区切り線
        ctx.strokeStyle = "#e0e4ec";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(ix, cy + 106);
        ctx.lineTo(cx + CARD_W - 8, cy + 106);
        ctx.stroke();

        // 感想メモ
        const filledComments = (item.comments ?? []).filter(c => c && c.trim());
        const joinedComment = filledComments.length > 1
          ? filledComments.map((c, i) => `${"①②③④⑤⑥⑦⑧⑨⑩"[i] ?? `(${i + 1})`}${c.trim()}`).join(" ")
          : (filledComments[0] ?? "").trim();
        if (joinedComment) {
          ctx.fillStyle = "#1a1d24";
          ctx.font = "11px 'Helvetica Neue', Arial, sans-serif";
          const commentLines = wrapLines(ctx, joinedComment, iw, 4);
          commentLines.forEach((line, li) => {
            ctx.fillText(line, ix, cy + 122 + li * 14, iw);
          });
        } else {
          ctx.fillStyle = "#b0b8c8";
          ctx.font = "11px 'Helvetica Neue', Arial, sans-serif";
          ctx.fillText("（感想なし）", ix, cy + 122, iw);
        }
      }

      // PNG blob をバッファとして収集
      canvases.push({ canvas, page: page + 1 });
    }

    // プレビューを表示（ダウンロードはユーザーが判断）
    const images = canvases.map(({ canvas, page }) => {
      const suffix = canvases.length > 1 ? `_${page}` : "";
      return { name: `animelog_${season}${suffix}.png`, dataUrl: canvas.toDataURL("image/png") };
    });
    setPreviewImages(images);
    showToast("プレビューを生成しました", "ok");
  };



  // ── Tier表 画像出力 ────────────────────────────────────────────────────
  const exportTierImage = async () => {
    const rated = visible.filter(x => repRating(x) !== "");
    if (rated.length === 0) { showToast("評価済みの作品がありません", "err"); return; }
    setShowExportMenu(false);
    showToast(`Tier表を生成中… (${rated.length}件)`, "info", 60000);

    const THUMB_H = 90; // 高さ固定・幅は各画像のアスペクト比に合わせて可変
    const ROW_LABEL_W = 56;
    const PAD = 16, GAP = 6;
    const RATING_COLORS = {
      "S+":{ bg:"#f5c842", text:"#111" },
      "S" :{ bg:"#f59342", text:"#fff" },
      "A+":{ bg:"#e05a7a", text:"#fff" },
      "A" :{ bg:"#c06ab0", text:"#fff" },
      "B" :{ bg:"#6ab0e0", text:"#fff" },
      "C" :{ bg:"#60b880", text:"#fff" },
      "D" :{ bg:"#888",    text:"#ccc" },
    };

    // ── Step1: キャッシュから画像を一括ロード（preloadAniListImages済み） ──
    const imgMap = {};
    await Promise.all(rated.map(async item => {
      imgMap[item.id] = await loadImg(item);
    }));

    // ── Step2: レイアウト計算（各画像のアスペクト比で幅を決め、左詰めフロー配置）──
    const tiers = RATINGS.filter(r => rated.some(x => repRating(x) === r.id));
    const CANVAS_W = 900;
    const INNER_W = CANVAS_W - PAD * 2 - ROW_LABEL_W - GAP;
    const FLOW_W = INNER_W - 12; // 内側余白（左右6px）を除いた配置可能幅
    const MIN_W = 60, MAX_W = 240, PLACEHOLDER_W = 120;

    const tierRows = tiers.map(r => {
      const items = rated.filter(x => repRating(x) === r.id);
      const placed = [];
      let cx = 0, line = 0;
      for (const item of items) {
        const img = imgMap[item.id];
        let w = PLACEHOLDER_W;
        if (img && img.width > 0 && img.height > 0) {
          // 画像のアスペクト比から幅を決定（極端な縦長・横長はクランプ）
          w = Math.round(THUMB_H * img.width / img.height);
          w = Math.max(MIN_W, Math.min(MAX_W, w));
        }
        if (cx + w > FLOW_W && cx > 0) { cx = 0; line++; } // 収まらなければ折り返し
        placed.push({ item, x: cx, line, w });
        cx += w + GAP;
      }
      const rowH = (line + 1) * (THUMB_H + GAP) - GAP + 12;
      return { ...r, placed, rowH };
    });

    const totalH = PAD + tierRows.reduce((s, r) => s + r.rowH + PAD, 0);
    const canvas = document.createElement("canvas");
    canvas.width = CANVAS_W; canvas.height = totalH;
    const ctx = canvas.getContext("2d");

    // ── Step3: 描画 ──
    ctx.fillStyle = "#f4f5f7";
    ctx.fillRect(0, 0, CANVAS_W, totalH);

    let curY = PAD;
    for (const tier of tierRows) {
      const rowH = tier.rowH + PAD;
      const rc = RATING_COLORS[tier.id];

      ctx.fillStyle = rc.bg;
      ctx.beginPath();
      ctx.roundRect(PAD, curY, ROW_LABEL_W, tier.rowH, 8);
      ctx.fill();

      ctx.fillStyle = rc.text;
      ctx.font = `bold ${tier.id.length > 1 ? 22 : 26}px 'Helvetica Neue', Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tier.id, PAD + ROW_LABEL_W / 2, curY + tier.rowH / 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.roundRect(PAD + ROW_LABEL_W + GAP, curY, INNER_W, tier.rowH, 8);
      ctx.fill();
      ctx.strokeStyle = "#d0d5dd";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(PAD + ROW_LABEL_W + GAP, curY, INNER_W, tier.rowH, 8);
      ctx.stroke();

      for (const p of tier.placed) {
        const { item, w } = p;
        const tx = PAD + ROW_LABEL_W + GAP + 6 + p.x;
        const ty = curY + 6 + p.line * (THUMB_H + GAP);
        const img = imgMap[item.id];

        if (img) {
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(tx, ty, w, THUMB_H, 6);
          ctx.clip();
          // 枠幅が画像のアスペクト比由来なので基本ぴったり収まる
          // （MIN/MAXでクランプされた場合のみ中央クロップで埋める）
          const scale = Math.max(w / img.width, THUMB_H / img.height);
          const dw = img.width * scale, dh = img.height * scale;
          ctx.drawImage(img, tx + (w - dw) / 2, ty + (THUMB_H - dh) / 2, dw, dh);
          ctx.restore();
        } else {
          ctx.fillStyle = "#e8eaf0";
          ctx.beginPath();
          ctx.roundRect(tx, ty, w, THUMB_H, 6);
          ctx.fill();
          ctx.fillStyle = "#9098b0";
          ctx.font = "22px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🎞️", tx + w / 2, ty + THUMB_H / 2);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
        }
      }
      curY += rowH;
    }

    // プレビューを表示（ダウンロードはユーザーが判断）
    setPreviewImages([{ name: "animelog_tier.png", dataUrl: canvas.toDataURL("image/png") }]);
    showToast("プレビューを生成しました", "ok");
  };

  const allItems = Object.values(items);
  const visible = allItems
    .filter(x => {
      if (filterMedia === "tv"    && x.media !== "tv")    return false;
      if (filterMedia === "movie" && x.media !== "movie") return false;
      if (filterRating === "unrated" && repRating(x) !== "") return false;
      if (filterRating !== "all" && filterRating !== "unrated" && repRating(x) !== filterRating) return false;
      if (filterWatched === "watched"   && !x.watched) return false;
      if (filterWatched === "unwatched" &&  x.watched) return false;
      if (searchQ.trim() && !x.title.toLowerCase().includes(searchQ.trim().toLowerCase())) return false;
      return true;
    })
    .sort((a, b) => {
      if (sortKey === "rating") return (RATING_ORDER[repRating(a)] ?? 99) - (RATING_ORDER[repRating(b)] ?? 99);
      if (sortKey === "title")  return a.title.localeCompare(b.title, "ja");
      // デフォルト: 読み込み時点の評価順位で固定（評価変更時に再ソートしない）
      const ra = sortSnapshot[a.id] ?? 99;
      const rb = sortSnapshot[b.id] ?? 99;
      if (ra !== rb) return ra - rb;
      return 0;
    });

  // 現在のメディアタブに絞った集計
  const mediaFiltered = filterMedia === "all"
    ? allItems
    : allItems.filter(x => x.media === filterMedia);
  const stats = RATINGS.map(r => ({ ...r, count: mediaFiltered.filter(x => repRating(x) === r.id).length })).filter(r => r.count > 0);
  const ratedCount   = mediaFiltered.filter(x => repRating(x) !== "").length;
  const watchedCount = mediaFiltered.filter(x => x.watched).length;
  const fmtTime = d => d ? `${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}` : "";

  return html`
    <div class="wrap">

      <div class="masthead">
        <div>
          <div class="masthead-logo">ANIME LOG</div>
          <div class="masthead-sub">季節アニメ 評価ノート</div>
        </div>
        ${user && html`
          <div style=${{ display:"flex", gap:"8px", alignItems:"center", flexWrap:"wrap" }}>
            <div class="user-badge">
              ${user.avatarUrl && html`<img src=${user.avatarUrl} alt="avatar" />`}
              <span>${user.name}</span>
            </div>
            <button class="btn btn-ghost btn-sm" onClick=${clearToken}>ログアウト</button>
          </div>
        `}
      </div>

      ${!token && html`
        <div class="token-wrap">
          <label class="field-label">Annictでログイン</label>
          <a class="btn btn-gold" href="/api/login"
            style=${{ display:"inline-block", textDecoration:"none", textAlign:"center" }}>
            Annictでログイン
          </a>
          ${tokenState === "err" && html`<div class="err-text">✗ ログインエラー</div>`}
          <details style=${{ marginTop:"14px" }}>
            <summary style=${{ fontSize:"12px", color:"var(--muted)", cursor:"pointer" }}>
              アクセストークンを手動で入力する
            </summary>
            <div class="row" style=${{ marginTop:"10px" }}>
              <input class="inp" type="password"
                placeholder="annict.com/settings/apps から発行したトークンを入力"
                value=${tokenInput}
                onInput=${e => setTokenInput(e.target.value)}
                onKeyDown=${e => e.key === "Enter" && applyToken()} />
              <button class="btn btn-gold" onClick=${applyToken}>接続</button>
            </div>
          </details>
        </div>
      `}
      ${token && tokenState === "ok" && html`
        <div class="token-wrap">
          <div class="ok-text" style=${{ marginTop:0 }}>✓ ログイン済み（次回から自動ログイン）</div>
        </div>
      `}

      ${token && html`
        <div class="controls">
          <select value=${season} onChange=${e => setSeason(e.target.value)}>
            ${SEASONS.map(s => html`<option key=${s.value} value=${s.value}>${s.label}</option>`)}
          </select>
          <button class="btn btn-ghost btn-sm"
            onClick=${() => { setItems({}); fetchSeason(token, season); }}
            disabled=${loading}>
            ${loading ? "読込中…" : "🔄 再読込"}
          </button>
          <div class="sep"></div>
          <button class="btn btn-ghost btn-sm"
            onClick=${() => { setItems({}); fetchSeason(token, season); }}
            disabled=${loading}>
            📚 視聴状態を再取得
          </button>
          <div class="sep"></div>
          <button class="btn btn-ghost btn-sm" onClick=${() => setShowAddSearch(true)}>＋ 作品を追加</button>
          <button class="btn btn-ghost btn-sm" style=${{ color:"var(--err)", borderColor:"rgba(192,57,43,.3)" }}
            onClick=${() => {
              if (!confirm("手動追加した作品をリセットしますか？\n（評価・感想はそのまま保持されます）")) return;
              // _manualアイテムをlocalStorageから削除（rating/commentは保持）
              const saved = loadSaved();
              const cleaned = {};
              for (const id in saved) {
                if (saved[id]._manual) {
                  // 評価・感想があれば通常アイテムとして残す
                  const { comments: cms, ratings: rts } = normalizeSlots(saved[id]);
                  if (hasAnyRating(rts) || hasAnyComment(cms)) {
                    cleaned[id] = { ratings: rts, comments: cms };
                  }
                } else {
                  cleaned[id] = saved[id];
                }
              }
              localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned));
              // itemsから_manualアイテムを除去
              setItems(prev => {
                const next = {};
                for (const id in prev) {
                  if (!prev[id]._manual) next[id] = prev[id];
                }
                return next;
              });
              showToast("手動追加した作品をリセットしました", "ok");
            }}>
            ↺ 追加リセット
          </button>
          <div style=${{ position:"relative", display:"inline-block" }}>
            <button class="btn btn-ghost btn-sm"
              onClick=${() => setShowExportMenu(v => !v)}>
              🖼 画像出力 ▾
            </button>
            ${showExportMenu && html`
              <div style=${{
                position:"absolute", top:"100%", left:0, marginTop:"4px",
                background:"var(--surface)", border:"1.5px solid var(--border)",
                borderRadius:"10px", boxShadow:"0 4px 16px rgba(0,0,0,.12)",
                zIndex:100, minWidth:"160px", overflow:"hidden"
              }}>
                <button style=${{
                  display:"block", width:"100%", padding:"10px 16px",
                  background:"transparent", border:"none", textAlign:"left",
                  cursor:"pointer", fontSize:"13px", color:"var(--text)",
                  fontFamily:"'Noto Sans JP',sans-serif", fontWeight:"500"
                }}
                  onClick=${() => { setShowExportMenu(false); exportImage(); }}
                  onMouseEnter=${e => e.target.style.background="var(--surface2)"}
                  onMouseLeave=${e => e.target.style.background="transparent"}
                >📋 カード形式</button>
                <div style=${{ height:"1px", background:"var(--border)", margin:"0 8px" }}></div>
                <button style=${{
                  display:"block", width:"100%", padding:"10px 16px",
                  background:"transparent", border:"none", textAlign:"left",
                  cursor:"pointer", fontSize:"13px", color:"var(--text)",
                  fontFamily:"'Noto Sans JP',sans-serif", fontWeight:"500"
                }}
                  onClick=${exportTierImage}
                  onMouseEnter=${e => e.target.style.background="var(--surface2)"}
                  onMouseLeave=${e => e.target.style.background="transparent"}
                >🏆 Tier表形式</button>
              </div>
            `}
          </div>
        </div>

        <div class="save-bar">
          <span class="save-bar-text">💾 評価・感想は自動保存され、Annictログインでどの端末からも同期されます。</span>
          ${savedAt && html`<span class="save-indicator">最終保存 ${fmtTime(savedAt)}</span>`}
        </div>

        <div class="media-tabs">
          ${[["all","すべて"],["tv","アニメ"],["movie","映画"]].map(([v,l]) => html`
            <button key=${v}
              class=${`media-tab${filterMedia === v ? " active" : ""}`}
              onClick=${() => setFilterMedia(v)}>${l}</button>
          `)}
        </div>

        <div class="search-row">
          <input class="inp" placeholder="タイトルで絞り込み…"
            value=${searchQ} onInput=${e => setSearchQ(e.target.value)} />
          <div class="sort-row">
            <span class="sort-label">並び順：</span>
            ${[["default","デフォルト"],["rating","評価順"],["title","50音順"]].map(([k, l]) => html`
              <button key=${k} class=${`sort-btn${sortKey === k ? " active" : ""}`}
                onClick=${() => setSortKey(k)}>${l}</button>
            `)}
          </div>
        </div>

        <div class="fchips">
          <span class="fchip-label">評価：</span>
          <button class=${`fchip${filterRating === "all" ? " all-active" : ""}`}
            onClick=${() => setFilterRating("all")}>ALL</button>
          ${RATINGS.map(r => html`
            <button key=${r.id} class="fchip"
              style=${filterRating === r.id ? { borderColor: r.color, color: r.color, background: r.color + "20" } : {}}
              onClick=${() => setFilterRating(filterRating === r.id ? "all" : r.id)}>
              ${r.label}
            </button>
          `)}
          <button class="fchip"
            style=${filterRating === "unrated" ? { borderColor:"#666", color:"#aaa", background:"#66666620" } : {}}
            onClick=${() => setFilterRating(filterRating === "unrated" ? "all" : "unrated")}>未評価</button>
          <div class="sep" style=${{ marginLeft:"4px" }}></div>
          ${[["all","すべて"],["watched","👁 視聴済"],["unwatched","未視聴"]].map(([v, l]) => html`
            <button key=${v} class=${`fchip${filterWatched === v ? " all-active" : ""}`}
              onClick=${() => setFilterWatched(v)}>${l}</button>
          `)}
        </div>

        ${(stats.length > 0 || watchedCount > 0) && html`
          <div class="stats">
            ${ratedCount > 0 && html`
              <div class="stat-pill" style=${{ borderColor:"rgba(245,200,66,.25)" }}>
                <span style=${{ fontSize:"11px", color:"var(--gold)" }}>評価済 ${ratedCount} 件</span>
              </div>`}
            ${watchedCount > 0 && html`
              <div class="stat-pill" style=${{ borderColor:"rgba(105,219,124,.25)" }}>
                <span style=${{ fontSize:"11px", color:"#69db7c" }}>視聴済 ${watchedCount} 件</span>
              </div>`}
            ${stats.map(s => html`
              <div key=${s.id} class="stat-pill" style=${{ borderColor: s.color + "44" }}>
                <div class="stat-badge" style=${{ background: s.bg, color: s.text }}>${s.label}</div>
                <span style=${{ fontSize:"12px", color: s.color }}>${s.count}</span>
              </div>
            `)}
          </div>
        `}

        <div class="list-header">
          <span class="count-label">${visible.length} 件表示中</span>
        </div>

        <div class="card-grid">
          ${loading && html`
            <div class="loading-wrap">
              <div class="spinner"></div>
              <div>読み込み中…</div>
            </div>`}
          ${!loading && visible.length === 0 && html`
            <div class="empty">
              <div class="big">📭</div>
              <p>表示できる作品がありません。<br/>上の「再読込」から読み込んでください。</p>
            </div>`}
          ${!loading && visible.map((item, i) => html`
            <${AnimeCard} key=${item.id} item=${item} index=${i}
              onChange=${patch => updateItem(item.id, patch)} />
          `)}
        </div>

        ${hasNextPage && !loading && html`
          <div style=${{ textAlign:"center", marginTop:"20px" }}>
            <button class="btn btn-ghost" onClick=${fetchMore}>
              ⬇ もっと読み込む
            </button>
          </div>
        `}
      `}

      ${showAddSearch && html`
        <div class="overlay" onClick=${() => { setShowAddSearch(false); setAddResults([]); setAddQuery(""); }}>
          <div class="modal" style=${{ maxWidth:"560px" }} onClick=${e => e.stopPropagation()}>
            <h3>＋ 作品を手動追加</h3>
            <p>年クールアニメや季節外の作品をタイトルで検索して追加できます。</p>
            <div class="row" style=${{ marginBottom:"12px" }}>
              <input class="inp" placeholder="タイトルを入力…"
                value=${addQuery}
                onInput=${e => setAddQuery(e.target.value)}
                onKeyDown=${e => e.key === "Enter" && doAddSearch()} />
              <button class="btn btn-gold btn-sm" onClick=${doAddSearch} disabled=${addSearching}>
                ${addSearching ? "検索中…" : "検索"}
              </button>
            </div>
            <div style=${{ maxHeight:"320px", overflowY:"auto", display:"flex", flexDirection:"column", gap:"8px" }}>
              ${addResults.length === 0 && !addSearching && addQuery && html`
                <p style=${{ fontSize:"13px", color:"var(--muted)", textAlign:"center", padding:"20px" }}>見つかりませんでした</p>
              `}
              ${addResults.map(w => {
                const id = String(w.annictId);
                const already = !!items[id];
                return html`
                  <div key=${id} style=${{
                    display:"flex", alignItems:"center", gap:"10px",
                    background:"var(--surface2)", borderRadius:"8px", padding:"8px 10px",
                    border:"1px solid var(--border)"
                  }}>
                    ${w.image?.recommendedImageUrl
                      ? html`<img src=${w.image.recommendedImageUrl} style=${{ width:"40px", height:"56px", objectFit:"cover", borderRadius:"4px", flexShrink:0 }} />`
                      : html`<div style=${{ width:"40px", height:"56px", background:"var(--surface2)", borderRadius:"4px", flexShrink:0 }}></div>`
                    }
                    <div style=${{ flex:1, minWidth:0 }}>
                      <div style=${{ fontSize:"13px", fontWeight:"700", color:"var(--text)" }}>${w.title}</div>
                      <div style=${{ fontSize:"11px", color:"var(--muted)", marginTop:"2px" }}>
                        ${w.seasonYear ? `${w.seasonYear}年${SEASON_NAMES[w.seasonName] ?? ""}` : ""}
                      </div>
                    </div>
                    <button class="btn btn-sm ${already ? "btn-ghost" : "btn-gold"}"
                      disabled=${already}
                      onClick=${() => addWorkManually(w)}>
                      ${already ? "追加済み" : "追加"}
                    </button>
                  </div>
                `;
              })}
            </div>
            <div class="modal-btns">
              <button class="btn btn-ghost btn-sm" onClick=${() => { setShowAddSearch(false); setAddResults([]); setAddQuery(""); }}>閉じる</button>
            </div>
          </div>
        </div>
      `}

      ${previewImages && html`
        <div class="overlay" onClick=${() => setPreviewImages(null)}>
          <div class="modal" style=${{ maxWidth:"720px", maxHeight:"85vh", display:"flex", flexDirection:"column" }} onClick=${e => e.stopPropagation()}>
            <h3>🖼 画像プレビュー ${previewImages.length > 1 ? `（${previewImages.length}枚）` : ""}</h3>
            <div style=${{ overflowY:"auto", flex:1, display:"flex", flexDirection:"column", gap:"12px", margin:"12px 0" }}>
              ${previewImages.map((img, i) => html`
                <img key=${i} src=${img.dataUrl}
                  style=${{ width:"100%", borderRadius:"8px", border:"1px solid var(--border)" }} />
              `)}
            </div>
            <div class="modal-btns">
              <button class="btn btn-ghost btn-sm" onClick=${() => setPreviewImages(null)}>閉じる</button>
              <button class="btn btn-gold btn-sm" onClick=${async () => {
                for (const img of previewImages) {
                  const a = document.createElement("a");
                  a.download = img.name;
                  a.href = img.dataUrl;
                  a.click();
                  if (previewImages.length > 1) await new Promise(r => setTimeout(r, 400));
                }
                setPreviewImages(null);
                showToast(previewImages.length > 1 ? `${previewImages.length}枚を保存しました` : "画像を保存しました", "ok");
              }}>⬇ ダウンロード</button>
            </div>
          </div>
        </div>
      `}

      ${toast && html`<div class=${`toast ${toast.type}`}>${toast.msg}</div>`}
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
